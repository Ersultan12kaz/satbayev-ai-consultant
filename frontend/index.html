<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Satbayev University — студент порталы</title>
  <link rel="stylesheet" href="portal.css">
</head>
<body>
<header class="bar">
  <button class="home" id="homeBtn" aria-label="Home">
    <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z" fill="currentColor"/></svg>
  </button>
  <div class="brand">
    <b>Satbayev University</b>
    <span data-t="portal">Студент порталы</span>
  </div>
  <div class="grow"></div>
  <button class="vision" id="visionBtn">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5C6.5 5 2.7 9.3 1.5 12c1.2 2.7 5 7 10.5 7s9.3-4.3 10.5-7C21.3 9.3 17.5 5 12 5zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z" fill="currentColor"/></svg>
    <span data-t="vision">Нашар көретіндерге арналған нұсқа</span>
  </button>
  <div class="user">
    <div class="uname" id="uname">Қонақ</div>
    <div class="urole" data-t="bachelor">Бакалавриат</div>
  </div>
  <div class="avatar" id="avatar">?</div>
  <button class="exit" id="authBtn">
    <svg viewBox="0 0 24 24" width="30" height="30"><path d="M10 4h9v16h-9v-2h7V6h-7zm-1 4 1.4 1.4L8.8 11H15v2H8.8l1.6 1.6L9 16l-4-4z" fill="currentColor"/></svg>
    <span id="authLabel">Кіру</span>
  </button>
  <div class="langs">
    <button data-lang="kk">Қаз</button>
    <button data-lang="ru">Рус</button>
    <button data-lang="en">Eng</button>
  </div>
</header>

<div class="page">
  <main class="chatcard">
    <div class="dhead">
      <div class="bot-ico">AI</div>
      <div>
        <b data-t="botTitle">Satbayev AI-кеңесші</b>
        <div class="dsub" data-t="botSub">Ресми құжаттар бойынша жауап береді · KZ / RU / EN</div>
      </div>
      <div class="grow"></div>
      <button class="icon" id="settingsBtn" title="⚙">⚙</button>
    </div>
    <div class="dsettings" id="dsettings">
      <label><span data-t="mode">Іздеу режимі</span>
        <select id="mode">
          <option value="hybrid">Hybrid (70% dense + 30% BM25)</option>
          <option value="dense">Dense</option>
          <option value="bm25">BM25</option>
        </select></label>
      <label>Top-K <select id="topk"><option>3</option><option selected>5</option><option>10</option></select></label>
      <label><input type="checkbox" id="showSources"> <span data-t="showSrc">Дереккөздерді көрсету</span></label>
      <label><input type="checkbox" id="showDebug"> <span data-t="debug">Табылған үзінділерді көрсету</span></label>
      <a id="adminLink" href="admin.html" style="display:none" data-t="admin">Әкімші панелі</a>
    </div>
    <div class="messages" id="messages"></div>
    <div class="quick" id="quick"></div>
    <form class="composer" id="composer">
      <textarea id="q" rows="1" maxlength="1000"></textarea>
      <button class="send" id="send" aria-label="send">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 20.5 21 12 3 3.5 3 10l12 2-12 2z" fill="currentColor"/></svg>
      </button>
    </form>
  </main>

  <aside class="side">
    <div class="notif"><span data-t="noNotif">Сізде жаңа хабарлама жоқ</span>: 0
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 5h18v14H3zm2 2v.5l7 4.5 7-4.5V7zm14 2.8-7 4.5-7-4.5V17h14z" fill="currentColor"/></svg>
    </div>
    <div class="carousel" id="carousel">
      <div class="slides" id="slides"></div>
      <div class="dots" id="dots"></div>
    </div>
    <button class="cta" id="ctaBtn"><span data-t="newChat">Жаңа сұхбат</span>
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 4h16v11H8l-4 4zm7 2v3H8v2h3v3h2v-3h3V9h-3V6z" fill="currentColor"/></svg>
    </button>
    <div class="stats" id="stats"></div>
  </aside>
</div>

<!-- login -->
<div class="modal" id="authModal">
  <div class="card">
    <h3 id="authTitle">Кіру</h3>
    <input id="fullName" style="display:none">
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password">
    <div class="err" id="authErr"></div>
    <div class="row">
      <button class="primary" id="authSubmit">Кіру</button>
      <button id="authSwitch">Тіркелу</button>
    </div>
    <div class="row"><button id="authClose" data-t="close">Жабу</button></div>
  </div>
</div>

<script src="portal.js"></script>
</body>
</html>
